[package]
name = "data-indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.24"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros"] }
unicode-normalization = "0.1"
